[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
hsk_testnet = "${HSK_TESTNET_RPC}"
hsk_mainnet = "${HSK_MAINNET_RPC}"
sepolia = "${SEPOLIA_RPC}"

[fmt]
line_length = 110
